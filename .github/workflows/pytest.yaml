name: pytest
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main, maint/0.4, maint/0.5, maint/0.6]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  pytest:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        python-version: ["3.11", "3.14"]
    name: ${{ matrix.os }} - py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - uses: pyvista/setup-headless-display-action@main
        with:
          qt: true
      - run: uv sync -q --locked --no-default-groups --group test --extra onnx --extra torch
      - run: mne_icalabel-sys_info --extra --developer
      - run: pytest tests --cov=mne_icalabel --cov-report=xml --cov-config=pyproject.toml
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests  # optional
          name: codecov-umbrella  # optional
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true  # optional (default = false)

  pytest-pip-pre:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    name: pip pre-release - py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - uses: pyvista/setup-headless-display-action@main
        with:
          qt: true
      - run: uv sync -q --locked --no-default-groups --group test --extra onnx --extra torch
      - name: Install pre-release dependencies
        run: |
          uv pip install -q --upgrade git+https://github.com/mne-tools/mne-python git+https://github.com/mne-tools/mne-bids
          uv pip install -q --upgrade --prerelease allow --only-binary :all: -i https://pypi.anaconda.org/scientific-python-nightly-wheels/simple --no-deps matplotlib
          uv pip install -q --upgrade --prerelease allow --only-binary :all: -i https://pypi.anaconda.org/scientific-python-nightly-wheels/simple numpy scipy
      - run: mne_icalabel-sys_info --extra --developer
      - run: pytest tests --cov=mne_icalabel --cov-report=xml --cov-config=pyproject.toml
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests  # optional
          name: codecov-umbrella  # optional
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true  # optional (default = false)

  pytest-backend:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        backend: ["torch", "onnx"]
        python-version: ["3.12"]
    name: ${{ matrix.os }} - ${{ matrix.backend }} backend - py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - uses: pyvista/setup-headless-display-action@main
        with:
          qt: true
      - run: uv sync -q --locked --no-default-groups --group test --extra ${{ matrix.backend }}
      - run: mne_icalabel-sys_info --extra --developer
      - run: pytest tests --cov=mne_icalabel --cov-report=xml --cov-config=pyproject.toml
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests  # optional
          name: codecov-umbrella  # optional
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true  # optional (default = false)
